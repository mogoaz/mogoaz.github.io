<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | Mogoa
    {% else %}
      Mogoa | Product Engineer & Security Engineer
    {% endif %}
  </title>

  <meta
    name="description"
    content="Product Engineer focused on cloud and network security, observability, security monitoring, and resilient systems."
  >

  <style>

    :root {
      --bg: #07111f;
      --bg-secondary: #0b1728;
      --card: #101d2f;

      --border: rgba(148, 163, 184, 0.16);

      --text: #e5e7eb;
      --muted: #94a3b8;
      --heading: #f8fafc;

      --blue: #38bdf8;
      --purple: #a78bfa;
      --green: #34d399;

      --max-width: 1200px;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      padding: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.7;
    }


    a {
      color: inherit;
    }


    .portfolio {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(56, 189, 248, 0.08),
          transparent 30%
        ),
        var(--bg);
    }


    /* ===============================
       NAVIGATION
       =============================== */

    .portfolio-nav {
      position: sticky;

      top: 0;

      z-index: 1000;

      width: 100%;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(7, 17, 31, 0.92);

      backdrop-filter: blur(14px);
    }


    .portfolio-nav-inner {
      width:
        min(
          calc(100% - 40px),
          var(--max-width)
        );

      min-height: 72px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 30px;
    }


    .portfolio-logo {
      color: white;

      font-size: 1.15rem;

      font-weight: 900;

      letter-spacing: -0.03em;

      text-decoration: none;
    }


    .portfolio-logo span {
      color: var(--blue);
    }


    .portfolio-nav-links {
      display: flex;

      align-items: center;

      gap: 28px;
    }


    .portfolio-nav-links a {
      color: var(--muted);

      font-size: 0.88rem;

      font-weight: 700;

      text-decoration: none;

      transition: color 0.2s ease;
    }


    .portfolio-nav-links a:hover {
      color: var(--blue);
    }


    /* ===============================
       CONTAINER
       =============================== */

    .portfolio-container {
      width:
        min(
          calc(100% - 40px),
          var(--max-width)
        );

      margin: 0 auto;
    }


    .portfolio-section {
      padding: 100px 0;
    }


    .portfolio-label {
      display: block;

      margin-bottom: 12px;

      color: var(--blue);

      font-size: 0.75rem;

      font-weight: 900;

      letter-spacing: 0.16em;

      text-transform: uppercase;
    }


    .portfolio-section h2 {
      margin: 0 0 20px;

      color: var(--heading);

      font-size:
        clamp(
          2rem,
          5vw,
          3.5rem
        );

      line-height: 1.05;

      letter-spacing: -0.04em;
    }


    .portfolio-description {
      max-width: 760px;

      color: var(--muted);

      font-size: 1.05rem;

      line-height: 1.9;
    }


    /* ===============================
       HERO
       =============================== */

    .portfolio-hero {
      min-height:
        calc(100vh - 72px);

      display: flex;

      align-items: center;

      position: relative;

      overflow: hidden;
    }


    .portfolio-hero::before {
      content: "";

      position: absolute;

      inset: 0;

      opacity: 0.22;

      background-image:
        linear-gradient(
          rgba(148, 163, 184, 0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(148, 163, 184, 0.08) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      pointer-events: none;
    }


    .portfolio-hero-content {
      position: relative;

      z-index: 2;

      padding: 100px 0;
    }


    .portfolio-status {
      display: inline-flex;

      align-items: center;

      gap: 10px;

      padding: 8px 14px;

      border:
        1px solid
        rgba(52, 211, 153, 0.25);

      border-radius: 999px;

      background:
        rgba(52, 211, 153, 0.07);

      color: #a7f3d0;

      font-size: 0.85rem;

      font-weight: 800;
    }


    .portfolio-status-dot {
      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 14px
        rgba(52, 211, 153, 0.8);
    }


    .portfolio-hero h1 {
      max-width: 950px;

      margin: 28px 0 0;

      color: var(--heading);

      font-size:
        clamp(
          4rem,
          9vw,
          7.5rem
        );

      line-height: 0.92;

      letter-spacing: -0.065em;
    }


    .portfolio-gradient {
      background:
        linear-gradient(
          90deg,
          var(--blue),
          #60a5fa,
          var(--purple)
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;
    }


    .portfolio-hero-text {
      max-width: 760px;

      margin: 35px 0 0;

      color: #cbd5e1;

      font-size:
        clamp(
          1.05rem,
          2vw,
          1.25rem
        );

      line-height: 1.9;
    }


    /* ===============================
       BUTTONS
       =============================== */

    .portfolio-buttons {
      display: flex;

      flex-wrap: wrap;

      gap: 14px;

      margin-top: 38px;
    }


    .portfolio-button {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 50px;

      padding: 0 22px;

      border-radius: 8px;

      text-decoration: none;

      font-size: 0.88rem;

      font-weight: 900;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }


    .portfolio-button:hover {
      transform: translateY(-2px);
    }


    .portfolio-button-primary {
      background: var(--blue);

      color: #082f49;
    }


    .portfolio-button-primary:hover {
      background: #7dd3fc;
    }


    .portfolio-button-secondary {
      border:
        1px solid
        rgba(148, 163, 184, 0.3);

      color: var(--text);

      background:
        rgba(15, 23, 42, 0.5);
    }


    .portfolio-button-secondary:hover {
      border-color: var(--blue);
    }


    /* ===============================
       CARDS
       =============================== */

    .portfolio-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;

      margin-top: 45px;
    }


    .portfolio-card {
      padding: 30px;

      border:
        1px solid
        var(--border);

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(21, 32, 49, 0.9),
          rgba(10, 20, 34, 0.9)
        );

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }


    .portfolio-card:hover {
      transform: translateY(-5px);

      border-color:
        rgba(56, 189, 248, 0.4);
    }


    .portfolio-card-number {
      color: var(--blue);

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 0.75rem;

      font-weight: 900;
    }


    .portfolio-card h3 {
      margin: 18px 0 10px;

      color: var(--heading);

      font-size: 1.25rem;
    }


    .portfolio-card p {
      margin: 0;

      color: var(--muted);

      font-size: 0.92rem;

      line-height: 1.8;
    }


    /* ===============================
       PROJECTS
       =============================== */

    .portfolio-projects {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 22px;

      margin-top: 45px;
    }


    .portfolio-project {
      padding: 34px;

      border:
        1px solid
        var(--border);

      border-radius: 16px;

      background: var(--card);
    }


    .portfolio-project h3 {
      margin: 14px 0;

      color: var(--heading);

      font-size: 1.45rem;
    }


    .portfolio-project p {
      color: var(--muted);

      line-height: 1.8;
    }


    .portfolio-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin: 22px 0;
    }


    .portfolio-tag {
      padding:
        5px 10px;

      border:
        1px solid
        rgba(148, 163, 184, 0.2);

      border-radius: 5px;

      color: #cbd5e1;

      font-size: 0.72rem;

      font-weight: 800;
    }


    .portfolio-project-link {
      color: var(--blue);

      font-size: 0.85rem;

      font-weight: 900;

      text-decoration: none;
    }


    /* ===============================
       CTA
       =============================== */

    .portfolio-cta {
      padding: 120px 0;

      text-align: center;

      border-top:
        1px solid
        var(--border);

      background:
        radial-gradient(
          circle at 50% 100%,
          rgba(56, 189, 248, 0.1),
          transparent 45%
        );
    }


    .portfolio-cta h2 {
      max-width: 800px;

      margin:
        0 auto 20px;

      color: var(--heading);

      font-size:
        clamp(
          2.5rem,
          6vw,
          4.5rem
        );
    }


    .portfolio-cta p {
      max-width: 650px;

      margin:
        0 auto;

      color: var(--muted);

      line-height: 1.8;
    }


    .portfolio-cta .portfolio-buttons {
      justify-content: center;
    }


    /* ===============================
       FOOTER
       =============================== */

    .portfolio-footer {
      padding: 30px 0;

      border-top:
        1px solid
        var(--border);
    }


    .portfolio-footer-inner {
      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .portfolio-footer p {
      margin: 0;

      color: #64748b;

      font-size: 0.8rem;
    }


    /* ===============================
       RESPONSIVE
       =============================== */

    @media (max-width: 900px) {

      .portfolio-grid {
        grid-template-columns:
          1fr 1fr;
      }

      .portfolio-projects {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 650px) {

      .portfolio-container,
      .portfolio-nav-inner {
        width:
          min(
            calc(100% - 28px),
            var(--max-width)
          );
      }


      .portfolio-nav-links {
        display: none;
      }


      .portfolio-grid {
        grid-template-columns: 1fr;
      }


      .portfolio-hero h1 {
        font-size: 3.8rem;
      }


      .portfolio-buttons {
        flex-direction: column;
      }


      .portfolio-button {
        width: 100%;
      }


      .portfolio-footer-inner {
        flex-direction: column;

        gap: 10px;

        text-align: center;
      }

    }

  </style>

</head>


<body>

  <div class="portfolio">


    <!-- NAVIGATION -->

    <nav class="portfolio-nav">

      <div class="portfolio-nav-inner">

        <a
          class="portfolio-logo"
          href="/"
        >
          M<span>O</span>GOA
        </a>


        <div class="portfolio-nav-links">

          <a href="/about/">
            About
          </a>

          <a href="/projects/">
            Projects
          </a>

          <a href="/experience/">
            Experience
          </a>

          <a href="/security/">
            Security
          </a>

          <a href="/contact/">
            Contact
          </a>

        </div>

      </div>

    </nav>


    <!-- PAGE CONTENT -->

    {{ content }}


    <!-- FOOTER -->

    <footer class="portfolio-footer">

      <div class="portfolio-container">

        <div class="portfolio-footer-inner">

          <p>
            © {{ site.time | date: "%Y" }} Mogoa.
          </p>

          <p>
            Product Engineering · Security Engineering
          </p>

        </div>

      </div>

    </footer>


  </div>

</body>

</html>
